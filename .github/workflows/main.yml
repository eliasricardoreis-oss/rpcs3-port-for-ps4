name: Build PS4 PKG (RPCS3 Port - Native Flow)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: ubuntu-22.04
    name: Compile & Package PS4 PKG (Docs Flow)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure Git Safe Defaults
        run: |
          git config --global --unset-all core.sshCommand || true
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          cd rpcs3-ps4 || true
          git update-index --add --cacheinfo "160000,ca7933e47d3a3451d81e72ac174dcb5aa28b59d1,3rdparty/llvm/llvm" || true
          git commit -m "Record RPCS3's LLVM submodule pin" || true

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git curl wget build-essential pkg-config unzip

      # Script Python atualizado com tratamento de erros e fallback para links do llvm-mingw
      - name: Setup PS4 Toolchain & llvm-mingw Dependencies (Python Downloader)
        run: |
          mkdir -p ps4-toolchain-deps
          cd ps4-toolchain-deps
          python3 -c '
          import urllib.request
          import zipfile
          import tarfile
          import os

          def download_file(url, dest):
              print(f"A descarregar {url}...")
              headers = {"User-Agent": "Mozilla/5.0"}
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req) as response, open(dest, "wb") as out_file:
                      out_file.write(response.read())
                  print(f"Guardado em {dest} ({os.path.getsize(dest)} bytes)")
              except Exception as e:
                  print(f"Erro ao descarregar {url}: {e}")
                  raise e

          # 1. OpenOrbis SDK
          toolchain_url = "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/tags/v0.5.4.zip"
          download_file(toolchain_url, "toolchain.zip")
          with zipfile.ZipFile("toolchain.zip", "r") as zip_ref:
              zip_ref.extractall(".")
          
          if os.path.exists("OpenOrbis-PS4-Toolchain-0.5.4"):
              os.rename("OpenOrbis-PS4-Toolchain-0.5.4", "OpenOrbis-PS4-Toolchain")
          
          os.makedirs("OpenOrbis-PS4-Toolchain/include/orbis", exist_ok=True)
          os.makedirs("OpenOrbis-PS4-Toolchain/lib", exist_ok=True)
          with open("OpenOrbis-PS4-Toolchain/include/orbis/Types.h", "w") as f:
              f.write("")

          sdk_abs_path = os.path.abspath("OpenOrbis-PS4-Toolchain")
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"SDK_PATH={sdk_abs_path}\n")

          # 2. llvm-mingw (Tentando a versão mais recente/estável UCRT x86_64)
          llvm_urls = [
              "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.tar.xz",
              "https://github.com/mstorsjo/llvm-mingw/releases/latest/download/llvm-mingw-ucrt-x86_64.tar.xz"
          ]
          
          success = False
          for llvm_url in llvm_urls:
              try:
                  download_file(llvm_url, "llvm-mingw.tar.xz")
                  success = True
                  break
              except Exception:
                  print(f"Tentativa com {llvm_url} falhou, a tentar alternativa...")
          
          if not success:
              raise Exception("Todas as tentativas de descarregar o llvm-mingw falharam.")

          with tarfile.open("llvm-mingw.tar.xz", "r:*") as tar_ref:
              tar_ref.extractall(".")

          extracted_dir = [d for d in os.listdir(".") if d.startswith("llvm-mingw-") and os.path.isdir(d)][0]
          llvm_bin = os.path.abspath(os.path.join(extracted_dir, "bin"))
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"LLVM_BIN={llvm_bin}\n")
          print("Dependências configuradas com sucesso!")
          '

      - name: Prepare Pinned Dependencies
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/deps
          mkdir -p ps4-port/.build-tools
          if [ -f "./ps4-port/prepare-abseil.sh" ]; then
            ./ps4-port/prepare-abseil.sh || true
          fi

      - name: Configure and Build Native ELF
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/.build-abi
          
          cmake -S . -B ps4-port/.build-abi -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DRPCS3_PS4_PORT=ON \
            -DCMAKE_TOOLCHAIN_FILE=ps4-port/toolchain.cmake \
            -DRPCS3_PS4_SDK="${{ env.SDK_PATH }}" \
            -DRPCS3_PS4_LLVM_BIN="${{ env.LLVM_BIN }}" \
            -DCMAKE_C_COMPILER="${{ env.LLVM_BIN }}/clang" \
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_BIN }}/clang++" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build ps4-port/.build-abi --target rpcs3_ps4_elf -j $(nproc)

      - name: Locate PKG Output
        id: find_pkg
        run: |
          cd rpcs3-ps4
          mkdir -p output
          FOUND_PKG=$(find . -maxdepth 5 -name "*.pkg" | head -n 1)
          if [ -n "$FOUND_PKG" ]; then
            cp "$FOUND_PKG" output/rpcs3-ps4.pkg
            echo "pkg_exists=true" >> $GITHUB_OUTPUT
          else
            echo "AVISO: Nenhum arquivo .pkg gerado diretamente ainda."
            echo "pkg_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload PKG Artifact
        if: steps.find_pkg.outputs.pkg_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-PKG
          path: rpcs3-ps4/output/*.pkg
          retention-days: 14

      - name: Create Automatic Release on Success
        if: steps.find_pkg.outputs.pkg_exists == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v1
        with:
          files: rpcs3-ps4/output/*.pkg
          tag_name: build-${{ github.run_number }}
          name: RPCS3 PS4 Build #${{ github.run_number }}
          body: |
            Build automático gerado com sucesso via GitHub Actions!
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
