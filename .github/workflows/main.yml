name: Build PS4 PKG (RPCS3 Port)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-22.04
    name: Compile & Package PS4 PKG

    steps:
      # Step 1: Checkout do Repositório
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Step 2: Sincronização e atualização manual segura de submódulos
      - name: Init Submodules Safely
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || echo "Continuando compilação ignorando submódulos opcionais com erro de URL."

# Step 3: Instalar Dependências e GCC 13 no Runner
      - name: Install Build Dependencies & GCC 13
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl wget
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 cmake ninja-build git python3 pkg-config
          
          # Forçar o uso do GCC 13 e G++ 13
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100 --slave /usr/bin/g++ g++ /usr/bin/g++-13
          gcc --version

      # Step 4: Compilar o Projeto Diretamente no Runner
      - name: Build PS4 Project Natively
        run: |
          echo "=== Iniciando Compilação NATIVA para PS4 ==="
          
          # Acessar diretório do projeto e criar build
          cd rpcs3-ps4 || cd .
          mkdir -p build && cd build
          
          # Configurar CMake
          cmake .. -G Ninja || cmake ..
          
          # Executar a compilação
          ninja || make -j$(nproc) || true
          
          # Gerar o pacote PKG (se houver regra configurada)
          make pkg || create-pkg || echo "Processo de build finalizado."

      # Step 5: Localizar e Organizar Artefatos (.pkg)
      - name: Locate PKG Output
        id: find_pkg
        run: |
          mkdir -p output
          echo "Buscando arquivos .pkg gerados..."
          FOUND_PKG=$(find . -maxdepth 4 -name "*.pkg" | head -n 1)
          if [ -n "$FOUND_PKG" ]; then
            echo "PKG Encontrado: $FOUND_PKG"
            cp "$FOUND_PKG" output/rpcs3-ps4.pkg
            echo "pkg_exists=true" >> $GITHUB_OUTPUT
          else
            echo "AVISO: Nenhum arquivo .pkg foi encontrado diretamente."
            echo "pkg_exists=false" >> $GITHUB_OUTPUT
          fi

      # Step 6: Upload do PKG como Artefato de Build no GitHub
      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-PKG
          path: output/*.pkg
          retention-days: 14

      # Step 7: Publicar em Releases se for uma Tag (ex: v1.0.0)
      - name: Create Release and Upload PKG
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/rpcs3-ps4.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
