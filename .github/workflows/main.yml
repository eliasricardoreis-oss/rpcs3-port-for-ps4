name: Build PS4 PKG (RPCS3 Port - Native Flow)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: ubuntu-22.04
    name: Compile & Package PS4 PKG (Docs Flow)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure Git Safe Defaults
        run: |
          git config --global --unset-all core.sshCommand || true
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          cd rpcs3-ps4 || true
          git update-index --add --cacheinfo "160000,ca7933e47d3a3451d81e72ac174dcb5aa28b59d1,3rdparty/llvm/llvm" || true
          git commit -m "Record RPCS3's LLVM submodule pin" || true

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git curl wget build-essential pkg-config unzip

      # Baixar e configurar o OpenOrbis e o llvm-mingw (Componentes obrigatórios do BUILDING.md)
      - name: Setup PS4 Toolchain & llvm-mingw Dependencies
        run: |
          mkdir -p ps4-toolchain-deps
          cd ps4-toolchain-deps
          
          # 1. Clonar OpenOrbis Toolchain com recursividade total
          git clone --recursive --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git OpenOrbis-PS4-Toolchain
          echo "SDK_PATH=$PWD/OpenOrbis-PS4-Toolchain" >> $GITHUB_ENV

          # 2. Baixar llvm-mingw (versão 20240619 UCRT x86_64 conforme especificação)
          wget -q https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.tar.xz
          tar -xf llvm-mingw-20240619-ucrt-x86_64.tar.xz
          echo "LLVM_BIN=$PWD/llvm-mingw-20240619-ucrt-x86_64/bin" >> $GITHUB_ENV
          
          cd ..

      - name: Prepare Pinned Dependencies
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/deps
          mkdir -p ps4-port/.build-tools
          if [ -f "./ps4-port/prepare-abseil.sh" ]; then
            ./ps4-port/prepare-abseil.sh || true
          fi

      - name: Configure and Build Native ELF
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/.build-abi
          
          # Configuração correta passando o SDK, o compilador llvm-mingw e o Ninja explicitamente
          cmake -S . -B ps4-port/.build-abi -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DRPCS3_PS4_PORT=ON \
            -DCMAKE_TOOLCHAIN_FILE=ps4-port/toolchain.cmake \
            -DRPCS3_PS4_SDK="${{ env.SDK_PATH }}" \
            -DRPCS3_PS4_LLVM_BIN="${{ env.LLVM_BIN }}" \
            -DCMAKE_C_COMPILER="${{ env.LLVM_BIN }}/clang" \
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_BIN }}/clang++" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build ps4-port/.build-abi --target rpcs3_ps4_elf -j $(nproc)

      - name: Locate PKG Output
        id: find_pkg
        run: |
          cd rpcs3-ps4
          mkdir -p output
          FOUND_PKG=$(find . -maxdepth 5 -name "*.pkg" | head -n 1)
          if [ -n "$FOUND_PKG" ]; then
            cp "$FOUND_PKG" output/rpcs3-ps4.pkg
            echo "pkg_exists=true" >> $GITHUB_OUTPUT
          else
            echo "AVISO: Nenhum arquivo .pkg gerado diretamente ainda."
            echo "pkg_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload PKG Artifact
        if: steps.find_pkg.outputs.pkg_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-PKG
          path: rpcs3-ps4/output/*.pkg
          retention-days: 14

      - name: Create Automatic Release on Success
        if: steps.find_pkg.outputs.pkg_exists == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v1
        with:
          files: rpcs3-ps4/output/*.pkg
          tag_name: build-${{ github.run_number }}
          name: RPCS3 PS4 Build #${{ github.run_number }}
          body: |
            Build automático gerado com sucesso via GitHub Actions!
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
