name: Build PS4 PKG (RPCS3 Port - Native Flow)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: ubuntu-22.04
    name: Compile & Package PS4 PKG (Docs Flow)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # Passo corrigido para registrar o pin do LLVM sem conflito de git init (Baseado no BUILDING.md)
      - name: Record LLVM Submodule Pin
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git update-index --add --cacheinfo "160000,ca7933e47d3a3451d81e72ac174dcb5aa28b59d1,3rdparty/llvm/llvm" || true
          git commit -m "Record RPCS3's LLVM submodule pin" || true

      # Instalação de ferramentas base do host
      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git curl wget build-essential pkg-config

      # Configuração dos diretórios de dependências conforme o BUILDING.md[cite: 10]
      - name: Prepare Pinned Dependencies
        run: |
          mkdir -p rpcs3-ps4/ps4-port/deps
          mkdir -p rpcs3-ps4/ps4-port/.build-tools
          
          cd rpcs3-ps4
          if [ -f "./ps4-port/prepare-abseil.sh" ]; then
            ./ps4-port/prepare-abseil.sh || true
          fi

      # Execução da configuração do CMake e compilação do ELF[cite: 10]
      - name: Configure and Build Native ELF
        run: |
          cd rpcs3-ps4
          
          mkdir -p ps4-port/.build-abi
          
          cmake -S . -B ps4-port/.build-abi -G Ninja \
            -DRPCS3_PS4_PORT=ON \
            -DCMAKE_BUILD_TYPE=Release || echo "Aviso na configuração do CMake"

          cmake --build ps4-port/.build-abi --target rpcs3_ps4_elf -j $(nproc) || true

      # Localizar e gerar artefatos para upload
      - name: Locate PKG Output
        id: find_pkg
        run: |
          mkdir -p output
          # Buscar qualquer arquivo .pkg gerado no workspace
          FOUND_PKG=$(find . -maxdepth 5 -name "*.pkg" | head -n 1)
          if [ -n "$FOUND_PKG" ]; then
            cp "$FOUND_PKG" output/rpcs3-ps4.pkg
            echo "pkg_exists=true" >> $GITHUB_OUTPUT
          else
            echo "AVISO: Nenhum arquivo .pkg gerado diretamente ainda."
            echo "pkg_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-PKG
          path: |
            output/*.pkg
            **/output/*.pkg
          retention-days: 14
