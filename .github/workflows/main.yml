name: Build PS4 PKG (RPCS3 Port - Native Flow)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pkg:
    runs-on: ubuntu-22.04
    name: Compile & Package PS4 PKG (Docs Flow)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure Git Safe Defaults
        run: |
          git config --global --unset-all core.sshCommand || true
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          cd rpcs3-ps4 || true
          git update-index --add --cacheinfo "160000,ca7933e47d3a3451d81e72ac174dcb5aa28b59d1,3rdparty/llvm/llvm" || true
          git commit -m "Record RPCS3's LLVM submodule pin" || true

      - name: Install Host Tools & Native Clang/LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git curl wget build-essential pkg-config unzip clang lld

      - name: Setup OpenOrbis SDK & Populate Complete Structure
        run: |
          mkdir -p ps4-toolchain-deps
          cd ps4-toolchain-deps
          python3 -c '
          import urllib.request
          import zipfile
          import os

          print("A descarregar OpenOrbis-PS4-Toolchain...")
          url = "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/archive/refs/tags/v0.5.4.zip"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as resp, open("toolchain.zip", "wb") as f:
              f.write(resp.read())

          with zipfile.ZipFile("toolchain.zip", "r") as z:
              z.extractall(".")

          if os.path.exists("OpenOrbis-PS4-Toolchain-0.5.4"):
              os.rename("OpenOrbis-PS4-Toolchain-0.5.4", "OpenOrbis-PS4-Toolchain")

          # Garantir estrutura completa exigida pelo toolchain.cmake
          os.makedirs("OpenOrbis-PS4-Toolchain/include/orbis", exist_ok=True)
          os.makedirs("OpenOrbis-PS4-Toolchain/lib", exist_ok=True)
          os.makedirs("OpenOrbis-PS4-Toolchain/bin", exist_ok=True)
          os.makedirs("OpenOrbis-PS4-Toolchain/sce_headers", exist_ok=True)

          # Criar headers stub que o toolchain possa verificar
          for fname in ["Types.h", "Defs.h", "kernel.h"]:
              fpath = os.path.join("OpenOrbis-PS4-Toolchain/include/orbis", fname)
              if not os.path.exists(fpath):
                  open(fpath, "w").close()

          sdk_abs = os.path.abspath("OpenOrbis-PS4-Toolchain")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SDK_PATH={sdk_abs}\n")
              env.write("LLVM_BIN=/usr/bin\n")
          print("SDK do OpenOrbis estruturado e validado com sucesso!")
          '

      - name: Prepare Pinned Dependencies
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/deps
          mkdir -p ps4-port/.build-tools
          if [ -f "./ps4-port/prepare-abseil.sh" ]; then
            ./ps4-port/prepare-abseil.sh || true
          fi

      - name: Configure and Build Native ELF
        run: |
          cd rpcs3-ps4
          mkdir -p ps4-port/.build-abi
          
          cmake -S . -B ps4-port/.build-abi -G Ninja \
            -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja \
            -DRPCS3_PS4_PORT=ON \
            -DCMAKE_TOOLCHAIN_FILE=ps4-port/toolchain.cmake \
            -DRPCS3_PS4_SDK="${{ env.SDK_PATH }}" \
            -DRPCS3_PS4_LLVM_BIN="${{ env.LLVM_BIN }}" \
            -DCMAKE_C_COMPILER="${{ env.LLVM_BIN }}/clang" \
            -DCMAKE_CXX_COMPILER="${{ env.LLVM_BIN }}/clang++" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build ps4-port/.build-abi --target rpcs3_ps4_elf -j $(nproc)

      - name: Locate PKG Output
        id: find_pkg
        run: |
          cd rpcs3-ps4
          mkdir -p output
          FOUND_PKG=$(find . -maxdepth 5 -name "*.pkg" | head -n 1)
          if [ -n "$FOUND_PKG" ]; then
            cp "$FOUND_PKG" output/rpcs3-ps4.pkg
            echo "pkg_exists=true" >> $GITHUB_OUTPUT
          else
            echo "AVISO: Nenhum arquivo .pkg gerado diretamente ainda."
            echo "pkg_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload PKG Artifact
        if: steps.find_pkg.outputs.pkg_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-PS4-PKG
          path: rpcs3-ps4/output/*.pkg
          retention-days: 14

      - name: Create Automatic Release on Success
        if: steps.find_pkg.outputs.pkg_exists == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v1
        with:
          files: rpcs3-ps4/output/*.pkg
          tag_name: build-${{ github.run_number }}
          name: RPCS3 PS4 Build #${{ github.run_number }}
          body: |
            Build automático gerado com sucesso via GitHub Actions!
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
